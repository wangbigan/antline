[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antline"
version = "0.2.1"
description = "CLI data production management tool — from source exploration to delivery"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Antline Contributors" }
]
keywords = ["data", "etl", "dbt", "cli", "pipeline", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
tidb = ["pymysql>=1.1"]
all = [
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
]

[project.scripts]
antline = "antline.cli:app"

[project.urls]
Homepage = "https://github.com/antline-dev/antline"
Repository = "https://github.com/antline-dev/antline"
Issues = "https://github.com/antline-dev/antline/issues"

[tool.hatch.build.targets.wheel]
packages = ["antline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
